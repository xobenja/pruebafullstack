<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Productos</title>
  <link rel="stylesheet" href="productos.css">
</head>
<body>
  <header>
    <nav>
      <a href="../../Administrador/IndexAdministrador/indexAdministrador.html" class="volver">Volver</a>
      <h1>Administración de Productos</h1>
      <button id="btn-nuevo" class="btn-nuevo">➕ Nuevo Producto</button>
    </nav>
  </header>

  <main>
    <div class="tabla-container">
      <table class="usuarios-tabla">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productos-body">
          <!-- Productos cargados dinámicamente -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal para agregar/editar producto -->
<div id="modal" class="modal oculto">
  <div class="modal-contenido">
    <h2 id="modal-titulo">Nuevo Producto</h2>
    <form id="form-producto">
      <input type="hidden" id="producto-id">

      

      <label>Nombre:</label>
      <input type="text" id="producto-nombre" required>

      <label>Descripción:</label>
      <input type="text" id="producto-desc">

      <label>Precio:</label>
      <input type="number" id="producto-precio" step="0.01" required>



      <label>Stock Crítico:</label>
      <input type="number" id="producto-stock-critico" step="1">

      <label>Categoría:</label>
      <select id="producto-categoria" required>
        <option value="">Selecciona una categoría</option>
        <option value="Hamburguesa">Hamburguesa</option>
        <option value="Papas">Papas</option>
        <option value="Completo">Completo</option>
      </select>

      <label>Imagen:</label>
      <input type="file" id="producto-img" accept="image/*">

      <div class="acciones-modal">
        <button type="submit" class="btn-nuevo">Guardar</button>
        <button type="button" id="cerrar-modal" class="btn-nuevo cancelar-btn">Cancelar</button>
      </div>
    </form>
  </div>
</div>

  <script src="productos.js"></script>
</body>
</html>
