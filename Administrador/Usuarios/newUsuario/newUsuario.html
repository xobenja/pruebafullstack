<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capibites - Registro</title>
    <link rel="icon" href="../../../img/logo.png" type="imagenes/png">
    <link rel="stylesheet" href="newUsuario.css">
</head>
<body>
    <header>
        <nav>
            <a href="../../IndexAdministrador/indexAdministrador.html"> Volver</a>
        </nav>
    </header>

    <main>
        <div class="registro">
            <h1 class="titulo">Capibites</h1>
            <form class="formulario-registro">
                <h2>Crear Cuenta</h2>

                <div class="grupo-input">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre" required>
                </div>

                <div class="grupo-input">
                    <label for="correo">Correo Electronico</label>
                    <input type="email" id="correo" name="correo" placeholder="TuCorreo@ejemplo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="Minimo 8 caracteres" required minlength="8">
                </div>

                <div class="grupo-input">
                    <label for="clave2">Confirmar Contraseña</label>
                    <input type="password" id="clave2" name="clave2" placeholder="Repite tu contraseña" required minlength="8">
                </div>

                <button type="submit" class="boton">Ingresar</button>
            </form>
        </div>
    </main>
    <script src="newUsuario.js"></script>
</body>
</html>
