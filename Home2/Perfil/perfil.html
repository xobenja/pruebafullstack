<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil</title>
  <link rel="stylesheet" href="perfil.css">
</head>
<body>
  <header>
    <nav>
      <a href="../Index2/index2.html" class="volver">Volver</a>
      <h1>Mi Perfil</h1>
    </nav>
  </header>

  <main>
    <section class="perfil-container">
      <!-- Avatar del usuario -->
      <div class="perfil-avatar">
        <div class="emoji-avatar">👤</div>
        <h2 id="nombre-usuario">John</h2>
        <p id="correo-usuario">john@*****.com</p>
      </div>

      <!-- Información editable -->
      <div class="perfil-info">
        <h3>Información Personal</h3>
        <form id="perfil-form">
          <label>RUN</label>
          <input type="text" id="input-run">

          <label>Nombre</label>
          <input type="text" id="input-nombre">

          <label>Apellidos</label>
          <input type="text" id="input-apellidos">

          <label>Correo</label>
          <input type="email" id="input-correo">

          <label>Fecha de Nacimiento</label>
          <input type="date" id="input-fecha-nac">

          <label>Contraseña</label>
          <input type="password" id="input-pass">

          <div class="perfil-acciones">
            <button type="submit" class="btn-guardar">Guardar Cambios</button>
            <button type="button" class="btn-cerrar">Cerrar Sesión</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="perfil.js" defer></script>
</body>
</html>
