<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Capibites</title>
    <link rel="stylesheet" href="../../Home/Index/index.css">
    <link rel="stylesheet" href="../../Home/Contacto/contacto.css">
    <link rel="stylesheet" href="contacto2.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
    </header>
<!---------------------------------------------------------------------------------/-->
    <button class="boton" id="boton">☰</button>
    <nav class="navegacion" id="navegacion">
        <a href="../Index2/index2.html">Inicio</a>
        <a href="../Productos2/productos2.html">Productos</a>
        <a href="../Nosotros2/nosotros2.html">Nosotros</a>
        
    </nav>
<!---------------------------------------------------------------------------------/-->
    <main class="content">
        <section>
            <h2>¿Cómo encontrarnos?</h2>
            <p><strong>Dirección:</strong> Av. Siempre Viva 123, San Bernardo</p>
            <p><strong>Teléfono:</strong> +56 9 1234 5678</p>
            <p><strong>Email:</strong> contacto@Capibites.cl</p>
        </section>

        <section>
        <h2>Formulario de contacto</h2>
        <form id="contacto2-form">
            <!-- NOMBRE -->
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required>
            <span class="error" id="error-nombre"></span><br><br>
            <!-- CORREO -->
            <label for="correo">Correo:</label><br>
            <input type="text" id="correo" name="correo" required>
            <span class="error" id="error-correo"></span><br><br>
            <!-- MENSAJE -->
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            <span class="error" id="error-mensaje"></span><br><br>
            <button type="submit">Enviar</button>
        </form>
        </section>
    </main>

    <script src="../../Home/Index/index.js" defer></script>
    <script src="contacto2.js" defer></script>
</body>
</html>
