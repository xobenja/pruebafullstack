<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capibites - Registro</title>
    <link rel="icon" href="../../img/logo.png" type="imagenes/png">
    <link rel="stylesheet" href="registrarse.css">
    <link rel="stylesheet" href="../Index/index.css">
</head>
<body>
    <header>
        <nav>
            <a href="../Index/index.html"> Menu principal</a>
        </nav>
    </header>

    <button class="boton" id="boton">☰</button>
    <nav class="navegacion" id="navegacion">
        <a href="../Index/index.html">Menu principal</a>
        <a href="../IniciarSesion/iniciarSesion.html">Iniciar sesión</a>
        <a href="../Productos/productos.html">Productos</a>
        <a href="../Contacto/contacto.html">Contacto</a>
        <a href="../Nosotros/nosotros.html">Nosotros</a>
        <a href="../Blogs/blogs.html">Blogs</a>
    </nav>

    <main>
        <div class="registro">
            <h1 class="titulo">Capibites</h1>
            <form action="../IniciarSesion/iniciarSesion.html" method="get" class="formulario-registro">
                <h2>Crear Cuenta</h2>

                <div class="grupo-input">
                    <label for="run">RUN</label>
                    <input type="text" id="run" name="run" placeholder="Ej: 123456789" required>
                </div>

                <div class="grupo-input">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre" required>
                </div>

                <div class="grupo-input">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Tus Apellidos" required>
                </div>

                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="TuCorreo@ejemplo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="fecha-nac">Fecha de Nacimiento</label>
                    <input type="date" id="fecha-nac" name="fecha-nac" required>
                </div>

                <div class="grupo-input">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="Minimo 8 caracteres" required minlength="8">
                </div>

                <div class="grupo-input">
                    <label for="clave2">Confirmar Contraseña</label>
                    <input type="password" id="clave2" name="clave2" placeholder="Repite tu contraseña" required minlength="8">
                </div>

                <button type="submit" class="btn">Registrarse</button>

                <p class="iniciar">
                    ¿Ya tienes cuenta? <a href="../IniciarSesion/iniciarSesion.html">Inicia Sesión</a>
                </p>
            </form>
        </div>
    </main>

    <script src="../Index/index.js" defer></script>
    <script src="registrarse.js" defer></script>
</body>
</html>
